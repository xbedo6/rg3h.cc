<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاتورة اشتراك — رِجعة</title><link rel="icon" href="/favicon.svg"><style>body{margin:0;background:#eaf0eb;color:#19372e;font:16px system-ui,sans-serif}.sheet{max-width:760px;margin:32px auto;background:white;padding:42px;border-radius:22px;box-shadow:0 14px 60px #18372e16}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #dce6de;padding-bottom:24px}header img{width:140px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:28px 0}small{display:block;color:#69766d;margin-bottom:8px}h1{font-size:26px;margin:0}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:16px 8px;border-bottom:1px solid #dce6de}.total{font-size:24px;text-align:left;margin:24px 0}.notes{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:12px;justify-content:center;margin:24px}button,a{background:#1c4031;color:white;border:0;border-radius:25px;padding:12px 22px;text-decoration:none;font:inherit;cursor:pointer}.notice{font-size:13px;color:#69766d;border-top:1px solid #dce6de;padding-top:18px}@media(max-width:600px){.sheet{margin:12px;padding:22px}.meta{grid-template-columns:1fr}header img{width:100px}h1{font-size:22px}table{font-size:13px}}@media print{body{background:white}.sheet{margin:0;max-width:none;box-shadow:none;border-radius:0;padding:16px}.actions{display:none}@page{size:A4;margin:16mm}}</style></head><body><main class="sheet" id="invoice-view" aria-live="polite">جارٍ تحميل الفاتورة…</main><div class="actions"><button id="invoice-print" disabled>طباعة / حفظ PDF</button><a href="/admin">لوحة الإدارة</a></div><script src="/invoice-print.js"></script></body></html>
